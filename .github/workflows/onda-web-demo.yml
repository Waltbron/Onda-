name: ONDA · Demo web temporal (GitHub Pages)

on:
  push:
    branches: [chore/instalar-motor-v3-1]
    paths:
      - '.github/workflows/onda-web-demo.yml'
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: onda-pages-demo
  cancel-in-progress: false

jobs:
  publicar-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Obtener ONDA
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar motor y catálogo
        run: |
          npm test
          npm run check
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir web estática
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      - name: Desplegar demo
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Informe
        if: always()
        run: |
          echo '### ONDA · Demo estática' >> "$GITHUB_STEP_SUMMARY"
          echo 'Catálogo histórico con fuentes automáticas desactivadas. No usar como agenda vigente.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Netlify y la rama main no fueron modificados.' >> "$GITHUB_STEP_SUMMARY"
